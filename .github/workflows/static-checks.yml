name: Static checks (no UE build)
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  volume:
    name: 体積演算の検証（UE不要）
    # ubuntu-latestのOS世代更新で浮動小数点依存の閉曲面テスト結果が変わらないよう固定する。
    # Ubuntu 26.04対応は別途テストしてから更新する。
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: C++をビルド
        run: g++ -std=c++17 -O2 -Wall -Wextra -Werror Tests/test_volume.cpp -o /tmp/ap5-test-volume
      - name: 貫通・修復・切断・連結判定・落下を検証
        run: /tmp/ap5-test-volume
  checks:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: PowerShell 5.1 syntax
        shell: powershell
        run: ./Tests/Test-PowerShell.ps1
      - name: PowerShell 7 syntax
        shell: pwsh
        run: ./Tests/Test-PowerShell.ps1
      - name: Project and map-script tests (mocked UE API)
        shell: pwsh
        run: python -m unittest discover -s Tests -v
